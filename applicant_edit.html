<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Edit Application | SamurdhiSaviya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    .success-box {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(39, 174, 96, 0.28);
      background: rgba(39, 174, 96, 0.10);
      color: #1e8449;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    [hidden] { display: none !important; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .full-width {
      grid-column: 1 / -1;
    }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: 1; }
    }
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.97rem;
      padding: 20px 16px 10px;
      outline: none;
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .field textarea:focus {
      border-color: rgba(47, 111, 237, 0.5);
      box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12);
      background: var(--surface);
    }
    .field textarea:focus + label,
    .field textarea:not(:placeholder-shown) + label {
      top: -10px;
      font-size: 0.78rem;
      color: var(--accent);
      background: linear-gradient(180deg, transparent 50%, var(--surface-strong) 50%);
    }
    .file-upload-wrapper {
      position: relative;
      width: 100%;
      padding: 24px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-md);
      text-align: center;
      background: var(--surface-dim);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .file-upload-wrapper:hover {
      border-color: var(--accent);
      background: var(--surface);
    }
    .file-upload-wrapper i {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body class="light-mode">
  <div class="login-wrapper">
    <div class="login-container w-full max-w-4xl" style="width: 100%; max-width: 800px; padding: 48px;">
      
      <div class="logo-box">
        <img src="assets/images/emblem.png" alt="State Emblem" class="emblem">
        <div class="brand">
          <h1>Samurdhi<span>Saviya</span></h1>
          <p>Democratic Socialist Republic of Sri Lanka</p>
        </div>
      </div>

      <div class="login-header">
        <h2>Edit Application</h2>
        <p>Update your details below and resubmit for review.</p>
      </div>

      <div id="error-box" class="error-box" hidden>
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="error-msg"></span>
      </div>
      
      <div id="success-box" class="success-box" hidden>
        <i class="fa-solid fa-check-circle"></i>
        <span id="success-msg"></span>
      </div>

      <form id="edit-form" novalidate>
        
        <div class="form-grid">
          <div class="field full-width">
            <input type="text" id="Name" name="Name" placeholder=" " required>
            <label for="Name">Full Name (As per NIC)</label>
            <i class="fa-regular fa-user field-icon"></i>
          </div>

          <div class="field">
            <input type="text" id="NIC" name="NIC" placeholder=" " required>
            <label for="NIC">National Identity Card No.</label>
            <i class="fa-regular fa-id-card field-icon"></i>
          </div>

          <div class="field">
            <input type="date" id="DOB" name="DOB" required>
            <label for="DOB" style="top: -10px; font-size: 0.78rem; background: linear-gradient(180deg, transparent 50%, var(--surface-strong) 50%); color: var(--accent);">Date of Birth</label>
          </div>

          <div class="field full-width">
            <input type="text" id="Address" name="Address" placeholder=" " required>
            <label for="Address">Permanent Address</label>
            <i class="fa-solid fa-house field-icon"></i>
          </div>

          <div class="field">
            <select id="Gender" name="Gender" required>
              <option value="" disabled selected></option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
            <label for="Gender" style="top: -10px; font-size: 0.78rem; background: linear-gradient(180deg, transparent 50%, var(--surface-strong) 50%); color: var(--accent);">Gender</label>
          </div>

          <div class="field">
            <select id="Division" name="Division" required>
              <option value="" disabled selected></option>
              <option value="Colombo">Colombo</option>
              <option value="Gampaha">Gampaha</option>
              <option value="Kalutara">Kalutara</option>
              <option value="Kandy">Kandy</option>
              <option value="Galle">Galle</option>
            </select>
            <label for="Division" style="top: -10px; font-size: 0.78rem; background: linear-gradient(180deg, transparent 50%, var(--surface-strong) 50%); color: var(--accent);">Division Secretariat</label>
          </div>

          <!-- Application details -->
          <div class="field">
            <input type="number" id="Monthly_Income" name="Monthly_Income" placeholder=" " step="0.01" min="0" required>
            <label for="Monthly_Income">Declared Monthly Income (LKR)</label>
            <i class="fa-solid fa-coins field-icon"></i>
          </div>

          <div class="field">
            <input type="number" id="Dependents" name="Dependents" placeholder=" " min="0" max="20" required>
            <label for="Dependents">Number of Dependents</label>
            <i class="fa-solid fa-users field-icon"></i>
          </div>

          <div class="field full-width">
            <textarea id="Reason" name="Reason" placeholder=" " required></textarea>
            <label for="Reason">Reason for applying for Samurdhi welfare</label>
          </div>

          <!-- Bank details -->
          <div class="field">
            <input type="text" id="Bank_Name" name="Bank_Name" placeholder=" " required>
            <label for="Bank_Name">Bank Name</label>
            <i class="fa-solid fa-building-columns field-icon"></i>
          </div>

          <div class="field">
            <input type="text" id="Branch" name="Branch" placeholder=" " required>
            <label for="Branch">Branch</label>
            <i class="fa-solid fa-code-branch field-icon"></i>
          </div>

          <div class="field full-width">
            <input type="text" id="Account_Name" name="Account_Name" placeholder=" " required>
            <label for="Account_Name">Account Holder Name</label>
            <i class="fa-solid fa-user-tag field-icon"></i>
          </div>

          <div class="field full-width">
            <input type="text" id="Account_Number" name="Account_Number" placeholder=" " required>
            <label for="Account_Number">Account Number</label>
            <i class="fa-solid fa-hashtag field-icon"></i>
          </div>

        </div>

        <button type="submit" id="submit-btn" class="btn-primary" style="margin-top: 32px;">
          <span>Submit Updates</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

      </form>

      <div class="login-footer">
        <a href="applicant_dashboard.html" class="forgot-link">Cancel and return to Dashboard</a>
      </div>

    </div>
  </div>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/applicant_edit.js"></script>
</body>
</html>
